# Local development. Production runs its own compose file on the droplet; this one
# exists so the two-container shape can be exercised before it gets there.
#
# Values come from .env, which Compose also reads for the ${...} interpolation below,
# so the database service and the two app services cannot disagree about credentials.
services:
  # The Discord bot: gateway connections, commands and feeds. No HTTP.
  bot:
    container_name: "nexus-mods-bot"
    build: .
    image: nexus-mods-bot
    # The image default. Stated explicitly so the pair reads as two commands over one
    # image rather than one service with an override bolted on.
    command: ["node", "dist/shards.js"]
    env_file:
      - .env
    environment: &db_overrides
      # .env points at a database reachable from the host. Inside a container,
      # localhost is the container - these override it to the compose service.
      HOST: postgres
      PORT: 5432
      # The local Postgres below has no TLS. Without this, an unset or production
      # NODE_ENV defaults SSL on and the connection is refused.
      DB_SSL: "off"
    depends_on:
      - postgres
    restart: unless-stopped

  # The OAuth portal, tracking pages and the forum/automod endpoints. Same image, same
  # tag, different entry point - so the two can never be running different code against
  # the same database.
  web:
    container_name: "nexus-mods-bot-web"
    build: .
    image: nexus-mods-bot
    command: ["node", "dist/web.js"]
    env_file:
      - .env
    environment:
      <<: *db_overrides
      AUTH_PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    restart: unless-stopped
    # TempStore holds in-flight OAuth state in memory, so this service is
    # single-replica by construction. Scaling it needs that moved out first.
    scale: 1

  # Matches production (PostgreSQL 17). A postgres_data volume created by an older
  # image will refuse to start under 17 - remove the volume to recreate it empty,
  # since migrations rebuild the schema on first boot anyway.
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DBUSER}
      POSTGRES_PASSWORD: ${DBPASS}
      POSTGRES_DB: ${DATABASE}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
