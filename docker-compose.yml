# Local development. Production runs its own compose file on the droplet; this one
# exists so the two-container shape can be exercised before it gets there.
#
# Values come from .env, which Compose also reads for the ${...} interpolation below,
# so the database service and the two app services cannot disagree about credentials.
services:
  # The Discord bot: gateway connections, commands and feeds. No HTTP.
  bot:
    container_name: "nexus-mods-bot"
    build: .
    image: nexus-mods-bot
    # The image default. Stated explicitly so the pair reads as two commands over one
    # image rather than one service with an override bolted on.
    command: ["node", "dist/shards.js"]
    env_file:
      - .env
    environment: &db_overrides
      # .env points at a database reachable from the host. Inside a container,
      # localhost is the container - these override it to the compose service.
      HOST: postgres
      PORT: 5432
      # The local Postgres below has no TLS. Without this, an unset or production
      # NODE_ENV defaults SSL on and the connection is refused.
      DB_SSL: "off"
    depends_on:
      - postgres
    restart: unless-stopped

  # The OAuth portal, tracking pages and the forum/automod endpoints. Its own image
  # since 5.0.0: a Next.js app built standalone, so it carries only the modules its
  # server loads rather than the bot's dependencies as well.
  #
  # The two images are built from the same commit and tagged with the same sha. Running
  # a bot and a web image from different shas is the mistake to avoid.
  web:
    container_name: "nexus-mods-bot-web"
    build:
      context: .
      dockerfile: Dockerfile.web
    image: nexus-mods-bot-web
    # The image default, stated so the pair reads as two services rather than one with an
    # override bolted on.
    command: ["node", "server.js"]
    env_file:
      - .env
    environment:
      <<: *db_overrides
      # PORT is what the Next server listens on. AUTH_PORT was Express's and means
      # nothing here.
      PORT: 3000
      # DBPORT, because PORT above is the HTTP port in this container. Without it the
      # database client would take 3000 as well and every query would fail.
      DBPORT: 5432
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    restart: unless-stopped
    # One replica. The in-flight OAuth state moved into a sealed cookie in 4.3.0, so this
    # service holds nothing between requests - but the rate limiting is per process, and a
    # second replica would silently double both limits.
    scale: 1

  # Matches production (PostgreSQL 17). A postgres_data volume created by an older
  # image will refuse to start under 17 - remove the volume to recreate it empty,
  # since migrations rebuild the schema on first boot anyway.
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DBUSER}
      POSTGRES_PASSWORD: ${DBPASS}
      POSTGRES_DB: ${DATABASE}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
