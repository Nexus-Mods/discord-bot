name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The generated GraphQL types are committed so the build does not depend on a
      # remote endpoint. This regenerates them and fails if the result differs from
      # what is in the repository - which catches both a stale checkout and a schema
      # that has changed under us. A failure here is informative either way.
      - name: GraphQL types are up to date
        run: npm run codegen:check

  docker:
    name: Build and push images
    runs-on: ubuntu-latest
    # Nothing is published unless typecheck, lint and tests pass first. Until 4.0.0
    # this job ran on every push to master with no checks in front of it.
    needs: [checks]
    # No `if` on the job any more: both images are BUILT on a pull request and only
    # PUSHED on a push to master. Until 5.0.0 there was one Dockerfile that had not
    # changed in a release, so building it on a branch bought nothing. Now there are two,
    # and the second is new - so without this the first build of the web image would
    # happen on master, minutes before the deploy webhook fires, with nothing between a
    # broken Dockerfile and production.
    steps:
      - uses: actions/checkout@v7

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        # Only a push publishes, so only a push needs credentials.
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the bot
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          # Previously only :latest was published, so there was no earlier image to
          # roll back to. The commit sha tag is the one to pin a rollback on.
          tags: |
            nexusmods/discord-bot:latest
            nexusmods/discord-bot:${{ steps.pkg.outputs.version }}
            nexusmods/discord-bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The auth site, as its own image. Publishing it changes nothing on its own: the
      # droplet runs whatever its redeploy script says, and that still starts the web
      # container from the bot image as `node dist/web.js`. Switching it over is a
      # separate, deliberate act - see DEPLOYING.md.
      - name: Build and push the web app
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          push: ${{ github.event_name == 'push' }}
          # The same three tags, and the sha is what pairs them: a bot image and a web
          # image built from the same commit share it. Deploying two different shas is
          # the mistake this makes visible.
          tags: |
            nexusmods/discord-bot-web:latest
            nexusmods/discord-bot-web:${{ steps.pkg.outputs.version }}
            nexusmods/discord-bot-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  redeploy:
    name: Redeploy webhook call
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push'
    steps:
      # This replaces joelwmale/webhook-action@master. A third-party action tracked
      # on a moving branch runs arbitrary code in a job that can read this repo's
      # secrets; whoever controls that repository controls what runs here. The call
      # is one HTTP POST, so it does not need an action at all.
      - name: Trigger deploy webhook
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning::DEPLOY_WEBHOOK_URL is not set - skipping deploy trigger."
            exit 0
          fi
          curl --fail --silent --show-error --location \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            --max-time 30 --retry 3 --retry-delay 5 \
            "$WEBHOOK_URL"
